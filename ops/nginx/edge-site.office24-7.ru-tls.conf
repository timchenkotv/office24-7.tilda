server {
    listen 127.0.0.1:9043 ssl;
    http2 on;
    server_name site.office24-7.ru;

    ssl_certificate /etc/letsencrypt/live/site.office24-7.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/site.office24-7.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    server_tokens off;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    proxy_http_version 1.1;
    proxy_connect_timeout 30s;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;

    location / {
        proxy_pass http://172.16.8.40:80;
    }
}
