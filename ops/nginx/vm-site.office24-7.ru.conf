server {
    listen 80;
    listen [::]:80;
    server_name site.office24-7.ru;

    root /srv/www/site.office24-7.ru/current/www;
    index index.html;
    charset utf-8;

    access_log /var/log/nginx/site.office24-7.ru.access.log;
    error_log /var/log/nginx/site.office24-7.ru.error.log;

    server_tokens off;
    etag on;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location = /api/getfeed/ {
        types { application/json html; }
        default_type application/json;
        add_header Cache-Control "no-store";
        try_files /api/getfeed/index.html =404;
    }

    location = / {
        try_files /index.html =404;
    }

    location / {
        try_files $uri $uri/ $uri/index.html $uri.html =404;
    }

    location ~* \.(?:woff2?|ttf)$ {
        types {
            font/woff woff;
            font/woff2 woff2;
            font/ttf ttf;
        }
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri =404;
        access_log off;
    }

    location ~* \.(?:css|js|jpg|jpeg|png|gif|webp|avif|svg|ico)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri =404;
        access_log off;
    }
}
